name: Daily bulletin filter

on:
  schedule:
    # Spain switches between CEST (UTC+2, summer) and CET (UTC+1, winter),
    # but GitHub Actions cron always runs in fixed UTC. Two schedules keep
    # the run landing near 10:00 Spain time year-round without manual changes:
    #   - Apr-Oct (CEST): 08:13 UTC ≈ 10:13 local
    #   - Nov-Mar (CET):  09:13 UTC ≈ 10:13 local
    # The exact DST changeover date (late March / late October) can be off
    # by a day or two around the switch itself — not worth chasing further.
    #
    # Minute is 13, not 0: GitHub Actions explicitly recommends against
    # scheduling at the top of the hour, since that's when scheduled-workflow
    # load across all of GitHub peaks and runs get queued/delayed the most.
    # (We saw this firsthand: with "0 8 ...", real runs landed 5-9h late.)
    - cron: "13 8 * 4-10 *"
    - cron: "13 9 * 1-3,11-12 *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recreate credentials and secrets as files
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          echo "$GMAIL_CREDENTIALS_JSON" > credentials.json
          echo "$GMAIL_TOKEN_JSON" > token.json

      - name: Run the pipeline
        env:
          BULLETIN_SENDER_EMAIL: ${{ secrets.BULLETIN_SENDER_EMAIL }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py